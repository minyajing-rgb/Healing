name: Prepare Earth Healing static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static website files
        run: |
          test -f index.html
          test -f map.html
          test -f story-provence.html
          test -f atlas-lavender.html
          test -f styles.css
          test -f app.js
          echo "Earth Healing static site is ready for GitHub Pages, Cloudflare Pages, Vercel, Netlify, or any static host."
