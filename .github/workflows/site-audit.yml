name: Website audit
on:
  push:
    paths: ['.github/workflows/site-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install Pillow --quiet
      - name: Inspect Pages and validate media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{html_url,build_type,source,status,cname}' || true
          python - <<'PY'
          import pathlib,urllib.request,json,subprocess
          from PIL import Image
          out={'images':[],'videos':[],'live':{}}
          for p in pathlib.Path('assets/reference/images').glob('*'):
              try:
                  im=Image.open(p); im.load(); item={'file':p.name,'valid':True,'dimensions':im.size}
              except Exception as e: item={'file':p.name,'valid':False,'error':str(e)}
              out['images'].append(item)
          for p in pathlib.Path('assets/reference/videos').glob('*'):
              r=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],capture_output=True,text=True,timeout=30)
              probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=width,height','-of','json',str(p)],capture_output=True,text=True)
              out['videos'].append({'file':p.name,'valid':r.returncode==0,'probe':probe.stdout,'error':r.stderr[:180]})
          try:
              r=urllib.request.urlopen('https://minyajing-rgb.github.io/Healing/',timeout=30)
              out['live']={'url':r.url,'status':r.status,'bytes':len(r.read())}
          except Exception as e: out['live']={'error':str(e)}
          pathlib.Path('audit-report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit
          path: audit-report.json
